<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - NextClass</title>
    <link rel="shortcut icon" type="image/png" th:href="@{/assets/logo-icon.png}">
    <link rel="stylesheet" th:href="@{/css/cadastro.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body>
<div class="container">

    <div class="form-image">
        <img th:src="@{/assets/chapeu.png}" alt="NextClass">
    </div>

    <div class="form">
        <div class="form-header">
            <div class="title">
                <h1>Cadastre-se como aluno</h1>
            </div>
            <div class="login-button">
                <button type="button"><a th:href="@{/login}">Entrar</a></button>
            </div>
        </div>

        <!-- Feedback global -->
        <div id="js-erro"    class="alert alert-danger"  style="display:none;"></div>
        <div id="js-sucesso" class="alert alert-success" style="display:none;"></div>

        <div class="input-group">

            <!-- Dados pessoais -->
            <div class="secao-titulo">Dados pessoais</div>

            <div class="input-box full" id="box-nome">
                <label for="nome">Nome completo</label>
                <input id="nome" type="text" placeholder="Digite seu nome completo" autocomplete="name" required>
                <span class="campo-erro" id="erro-nome"></span>
            </div>

            <div class="input-box" id="box-cpf">
                <label for="cpf">CPF</label>
                <input id="cpf" type="text" placeholder="000.000.000-00" maxlength="14" required>
                <span class="campo-erro" id="erro-cpf"></span>
            </div>

            <div class="input-box" id="box-nascimento">
                <label for="nascimento">Data de nascimento</label>
                <input id="nascimento" type="date" required>
                <span class="campo-erro" id="erro-nascimento"></span>
            </div>

            <div class="input-box" id="box-email">
                <label for="email">E-mail</label>
                <input id="email" type="email" placeholder="seu@email.com" autocomplete="email" required>
                <span class="campo-erro" id="erro-email"></span>
            </div>

            <div class="input-box" id="box-telefone">
                <label for="telefone">Celular</label>
                <input id="telefone" type="tel" placeholder="(xx) xxxxx-xxxx" maxlength="15" required>
                <span class="campo-erro" id="erro-telefone"></span>
            </div>

            <!-- Endereço -->
            <div class="secao-titulo">Endereço</div>

            <div class="input-box" id="box-cep">
                <label for="cep">CEP</label>
                <input id="cep" type="text" placeholder="00000-000" maxlength="9">
                <span class="campo-erro" id="erro-cep"></span>
            </div>

            <div class="input-box" id="box-estado">
                <label for="estado">Estado (UF)</label>
                <input id="estado" type="text" placeholder="BA" maxlength="2" required>
                <span class="campo-erro" id="erro-estado"></span>
            </div>

            <div class="input-box" id="box-cidade">
                <label for="cidade">Cidade</label>
                <input id="cidade" type="text" placeholder="Sua cidade" required>
                <span class="campo-erro" id="erro-cidade"></span>
            </div>

            <div class="input-box" id="box-bairro">
                <label for="bairro">Bairro</label>
                <input id="bairro" type="text" placeholder="Seu bairro" required>
                <span class="campo-erro" id="erro-bairro"></span>
            </div>

            <div class="input-box" id="box-logradouro">
                <label for="logradouro">Logradouro</label>
                <input id="logradouro" type="text" placeholder="Rua, Av., etc." required>
                <span class="campo-erro" id="erro-logradouro"></span>
            </div>

            <div class="input-box" id="box-numero">
                <label for="numero">Número</label>
                <input id="numero" type="text" placeholder="123">
            </div>

            <div class="input-box full">
                <label for="complemento">Complemento <span style="font-weight:400;color:#999;">(opcional)</span></label>
                <input id="complemento" type="text" placeholder="Apto, Bloco, etc.">
            </div>

            <!-- Senha -->
            <div class="secao-titulo">Acesso</div>

            <div class="input-box" id="box-senha">
                <label for="senha">Senha</label>
                <input id="senha" type="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password" required>
                <span class="toggle-senha" onclick="toggleSenha('senha','olho-senha')">
                    <i class="fa-regular fa-eye" id="olho-senha"></i>
                </span>
                <span class="campo-erro" id="erro-senha"></span>
            </div>

            <div class="input-box" id="box-confirmar">
                <label for="confirmar">Confirme a senha</label>
                <input id="confirmar" type="password" placeholder="Repita a senha" autocomplete="new-password" required>
                <span class="toggle-senha" onclick="toggleSenha('confirmar','olho-confirmar')">
                    <i class="fa-regular fa-eye" id="olho-confirmar"></i>
                </span>
                <span class="campo-erro" id="erro-confirmar"></span>
            </div>

        </div><!-- /input-group -->

        <div class="continue-button">
            <button id="btn-cadastro" onclick="efetuarCadastro()">
                <span class="spinner" id="spinner"></span>
                <span id="btn-texto">Continuar</span>
            </button>
        </div>
    </div><!-- /form -->

</div><!-- /container -->

<script th:inline="javascript">

    /* ── Máscaras ─────────────────────────────────── */
    document.getElementById('cpf').addEventListener('input', function () {
        let v = this.value.replace(/\D/g, '').slice(0, 11);
        v = v.replace(/(\d{3})(\d)/, '$1.$2')
            .replace(/(\d{3})(\d)/, '$1.$2')
            .replace(/(\d{3})(\d{1,2})$/, '$1-$2');
        this.value = v;
    });

    document.getElementById('telefone').addEventListener('input', function () {
        let v = this.value.replace(/\D/g, '').slice(0, 11);
        v = v.replace(/^(\d{2})(\d)/, '($1) $2')
            .replace(/(\d{5})(\d{1,4})$/, '$1-$2');
        this.value = v;
    });

    document.getElementById('cep').addEventListener('input', function () {
        let v = this.value.replace(/\D/g, '').slice(0, 8);
        v = v.replace(/(\d{5})(\d)/, '$1-$2');
        this.value = v;
    });

    document.getElementById('estado').addEventListener('input', function () {
        this.value = this.value.toUpperCase().replace(/[^A-Z]/g, '');
    });

    /* ── Busca CEP (ViaCEP) ───────────────────────── */
    document.getElementById('cep').addEventListener('blur', async function () {
        const cep = this.value.replace(/\D/g, '');
        if (cep.length !== 8) return;
        try {
            const r = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
            const d = await r.json();
            if (!d.erro) {
                document.getElementById('logradouro').value = d.logradouro || '';
                document.getElementById('bairro').value     = d.bairro     || '';
                document.getElementById('cidade').value     = d.localidade || '';
                document.getElementById('estado').value     = d.uf         || '';
            }
        } catch (_) {}
    });

    /* ── Toggle senha ─────────────────────────────── */
    function toggleSenha(inputId, iconId) {
        const input = document.getElementById(inputId);
        const olho  = document.getElementById(iconId);
        if (input.type === 'password') {
            input.type = 'text';
            olho.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            input.type = 'password';
            olho.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }

    /* ── Helpers ──────────────────────────────────── */
    function limparErros() {
        document.querySelectorAll('.input-box').forEach(b => b.classList.remove('invalido'));
        document.querySelectorAll('.campo-erro').forEach(e => e.textContent = '');
        document.getElementById('js-erro').style.display = 'none';
    }

    function marcarErro(boxId, erroId, msg) {
        const box = document.getElementById(boxId);
        const err = document.getElementById(erroId);
        if (box) box.classList.add('invalido');
        if (err) err.textContent = msg;
    }

    function mostrarErroGlobal(msg) {
        const el = document.getElementById('js-erro');
        el.textContent = msg;
        el.style.display = 'block';
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    /* ── Validação client-side ────────────────────── */
    function validar(dados) {
        let ok = true;

        if (!dados.nome || dados.nome.length < 3) {
            marcarErro('box-nome', 'erro-nome', 'Nome deve ter pelo menos 3 caracteres.');
            ok = false;
        }
        if (!/^\d{11}$/.test(dados.cpf)) {
            marcarErro('box-cpf', 'erro-cpf', 'CPF deve ter 11 dígitos numéricos.');
            ok = false;
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(dados.email)) {
            marcarErro('box-email', 'erro-email', 'E-mail inválido.');
            ok = false;
        }
        if (!/^\d{11}$/.test(dados.telefone)) {
            marcarErro('box-telefone', 'erro-telefone', 'Telefone deve ter 11 dígitos (DDD + número).');
            ok = false;
        }
        if (!dados.dataNascimento) {
            marcarErro('box-nascimento', 'erro-nascimento', 'Data de nascimento é obrigatória.');
            ok = false;
        }
        if (dados.cep && !/^\d{8}$/.test(dados.cep)) {
            marcarErro('box-cep', 'erro-cep', 'CEP deve ter 8 dígitos.');
            ok = false;
        }
        if (dados.senha.length < 8) {
            marcarErro('box-senha', 'erro-senha', 'Senha deve ter pelo menos 8 caracteres.');
            ok = false;
        }
        if (dados.senha !== document.getElementById('confirmar').value) {
            marcarErro('box-confirmar', 'erro-confirmar', 'As senhas não coincidem.');
            ok = false;
        }

        return ok;
    }

    /* ── Submit ───────────────────────────────────── */
    async function efetuarCadastro() {
        limparErros();

        const btn     = document.getElementById('btn-cadastro');
        const spinner = document.getElementById('spinner');
        const texto   = document.getElementById('btn-texto');

        const dados = {
            nome:     document.getElementById('nome').value.trim(),
            cpf:      document.getElementById('cpf').value.replace(/\D/g, ''),
            email:    document.getElementById('email').value.trim(),
            senha:    document.getElementById('senha').value,
            telefone: document.getElementById('telefone').value.replace(/\D/g, ''),
            dataNascimento: (() => {
                const v = document.getElementById('nascimento').value;
                if (!v) return null;
                const [y, m, d] = v.split('-');
                return `${d}/${m}/${y}`;
            })(),
            logradouro:  document.getElementById('logradouro').value.trim(),
            numero:      document.getElementById('numero').value.trim(),
            complemento: document.getElementById('complemento').value.trim(),
            bairro:      document.getElementById('bairro').value.trim(),
            cidade:      document.getElementById('cidade').value.trim(),
            estado:      document.getElementById('estado').value.trim(),
            cep:         document.getElementById('cep').value.replace(/\D/g, ''),
            role:        'ALUNO'
        };

        if (!validar(dados)) return;

        btn.classList.add('loading');
        spinner.style.display = 'inline-block';
        texto.textContent = 'Cadastrando...';

        try {
            const res = await fetch('/nextclass/auth/registrar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados),
                credentials: 'same-origin'
            });

            if (res.ok) {
                const ok = document.getElementById('js-sucesso');
                ok.textContent = 'Cadastro realizado! Redirecionando para o login...';
                ok.style.display = 'block';
                ok.scrollIntoView({ behavior: 'smooth', block: 'center' });
                setTimeout(() => window.location.href = /*[[@{/login}]]*/ '/login', 2000);
            } else {
                const err = await res.json().catch(() => ({}));
                if (Array.isArray(err.errors)) {
                    err.errors.forEach(e => mostrarErroGlobal(e.message));
                } else {
                    mostrarErroGlobal(err.message || 'Erro ao realizar cadastro. Tente novamente.');
                }
            }
        } catch (_) {
            mostrarErroGlobal('Erro de conexão. Tente novamente.');
        } finally {
            btn.classList.remove('loading');
            spinner.style.display = 'none';
            texto.textContent = 'Continuar';
        }
    }
</script>
</body>
</html>
